name: lifeos
description: "Privacy-First, Local-First Personal Memory Operating System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ^3.16.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.4

  # Navigation
  go_router: ^14.2.0

  # UI & Design
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  animate_do: ^3.1.2
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.2
  isar: ^3.1.0+1
  path_provider: ^2.1.2

  # Security & Encryption
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.1.1
  pointycastle: ^3.7.3

  # Biometrics
  local_auth: ^2.3.0
  local_auth_android: ^1.0.37
  local_auth_ios: ^1.1.5

  # Camera & File Handling
  camera: ^0.10.5+5
  image_picker: ^1.1.2
  file_picker: ^8.1.5
  image_gallery_saver: ^2.0.3

  # Document Processing
  pdf: ^3.10.7
  image: ^4.1.7
  flutter_tesseract_ocr: ^0.3.10

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  get_it: ^7.6.4
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  dio: ^5.4.0
  connectivity_plus: ^6.0.1

  # Platform Channels
  device_info_plus: ^10.1.0
  package_info_plus: ^5.0.1

  # Analytics & Monitoring
  sentry_flutter: ^7.14.0

  # AI/ML (Local)
  ml_linalg: ^20.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.5.1
  build_runner: ^2.4.9
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: ProximaNova
      fonts:
        - asset: assets/fonts/ProximaNova-Regular.ttf
          weight: 400
        - asset: assets/fonts/ProximaNova-Medium.ttf
          weight: 500
        - asset: assets/fonts/ProximaNova-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ProximaNova-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
